# LSTM baseline -- template
#
# Unconstrained black-box baseline for the CRNN arms. Data, washout and
# optimizer mirror ~/genSecSysId-Data/configs/crnn_gen-sec_duffing.yaml so that
# the model class is the only thing that differs in the comparison. When you
# copy this for another benchmark, copy the data/warmup block from that
# benchmark's CRNN config instead of editing it here.
#
# There is no certificate: no custom regularization, no MaxS, no safety filter.
# Runs land in <root_dir>/models/lstm/<run_id>.

# Data configuration -- keep identical to the CRNN config you compare against
data:
  train_path: "~/genSecSysId-Data/data/Duffing/id"
  input_col: ["u"]
  output_col: ["q"]
  state_col: ["q", "q_dot"]    # loaded for the pipeline; the LSTM ignores x0
  pattern: "*.csv"
  normalize: true
  normalization_method: "scale_only"
  batch_size: 32
  train_sequence_length: 700
  sequence_stride: 500
  shuffle: true
  num_workers: 0

  sampling_time: 0.05
  use_diverging_trajectories: true
  diverging_batch_size: 1

# Model configuration
model:
  model_type: "lstm"   # "rnn", "gru" work the same way
  nw: 32               # hidden size; ~4.5k params at 1 layer, the nx=2/nw=20 CRNN has ~0.1k
  num_layers: 1
  dropout: 0.0         # only applied between layers, i.e. num_layers > 1

# Optimizer configuration
optimizer:
  optimizer_type: "adam"
  learning_rate: 0.005
  weight_decay: 0.0
  use_scheduler: true
  scheduler_type: "reduce_on_plateau"
  scheduler_patience: 20
  scheduler_factor: 0.25

# Training configuration
training:
  max_epochs: 100
  gradient_clip_value: 1.0
  loss_type: "mse"
  # No certificate to regularize towards
  use_custom_regularization: false
  regularization_weight: 0.0
  input_regularization_weight: 0.0
  activity_regularization_weight: 0.0
  h_regularization_weight: 0.0
  device: "cpu"
  log_gradients: true
  # Same washout as the CRNN: the hidden state starts at zero and the first
  # warmup_steps samples are excluded from the loss and the metrics.
  warmup_steps: 500

# MLflow configuration
mlflow:
  tracking_uri: null
  experiment_name: "crnn-duffing_epsilon"   # same experiment as the CRNN arms
  run_name: "lstm-baseline"
  log_models: true
  log_artifacts: true

# Evaluation configuration
evaluation:
  metrics:
    - rmse
    - nrmse

# Paths
root_dir: "~/genSecSysId-Data"

# Reproducibility
seed: 43
log_level: "INFO"
