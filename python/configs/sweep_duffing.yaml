# Hyperparameter sweep definition for the Duffing experiment.
#
# Submit with:
#   cd ~/01_git/genSecSysId/python
#   bash slurm/submit_sweep.sh configs/sweep_duffing.yaml

sweep_name: duffing

# Base config — overrides are deep-merged on top of this file.
base_config: /data/work/ac137967/Duffing/config/crnn_gen-sec_duffing.yaml

# Number of independent runs per parameter combination (different random seeds).
# Seeds used: 0, 1, ..., n_seeds-1.
n_seeds: 3

# Optional: pass --true-dynamics to post_process.py for each run.
# true_dynamics: duffing

# Search space: dot-notation keys into the base config, list of values to try.
# Total array tasks = product of all list lengths × n_seeds.
# Current: 2 × 2 × 5 = 20 tasks (array indices 0–19).
#
# Two YAML forms are supported:
#   1) Single group (dict)  -> full cartesian product of all keys (default).
#   2) Multiple groups (list of dicts) -> tasks from each group are
#      *concatenated*, not multiplied. Use this when some keys are only
#      meaningful for a subset of runs and would otherwise produce duplicate
#      tasks (e.g. LMI-only params like model.custom_params.learn_L make
#      no difference when training.use_custom_regularization is false).
#
# Example multi-group sweep (uncomment to use instead of the dict below):
search_space:
  - training.use_custom_regularization: [true]
    model.custom_params.learn_L: [true, false]
    model.custom_params.regularization_method: ["interior_point", "dual"]
  - training.use_custom_regularization: [false]
