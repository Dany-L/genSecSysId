# Dedicated config for tests/test_sanity_convergence.py — the warm-start sanity gate.
#
# Independent of the working config in genSecSysId-Data on purpose: that file is a
# live experiment that changes while you develop, and the gate has to be a FIXED
# reference point ("are things still working?"). Everything here is checked in and
# versioned with the code.
#
# The test loads this through sysid.config.Config.from_yaml, so it also exercises
# the real config path — a renamed or dropped field shows up as a gate failure
# rather than as a silently ignored key.
#
# The data is generated by the test from a known Lure system in a tmpdir, so
# data.train_path is unused; the loader settings below (windowing, normalization,
# batch size) are the ones that matter and mirror the Duffing setup at reduced size.

data:
  train_path: "<generated by the test>"   # unused; the fixture builds the data
  input_col: ["u"]
  output_col: ["q"]
  state_col: ["q", "q_dot"]
  pattern: "*.csv"
  normalize: true
  normalization_method: "scale_only"
  batch_size: 8
  train_sequence_length: 300
  sequence_stride: 300
  shuffle: false            # deterministic, so the gate is reproducible
  num_workers: 0
  sampling_time: 0.05
  # The gate runs BOTH variants from this one config: 'gate' (converging only) and
  # 'gate_diverging' (with the diverging pass). This flag records that the diverging
  # variant is expected to run — it needs training.gradient_clip_value below, or one
  # spike from a diverging rollout inflates Adam's second moment and freezes the
  # effective step size for ~1000 steps.
  use_diverging_trajectories: true
  diverging_batch_size: 1

model:
  model_type: "crnn"
  nx: 2
  nw: 8
  activation: "dzn"
  custom_params:
    learn_L: true
    structural_constraints:
      D:
        fixed: true
        value: 0.0
      D12:
        fixed: true
        value: 0.0

  initialization:
    # warm_start_path is filled in by the test with the .npz the fixture writes for
    # the reference system it generated the data from.
    method: warm_start
    warm_start_units: physical
    warm_start_noise: 0.002
    warm_start_seed: 0

optimizer:
  optimizer_type: "adam"
  # 5e-3 (what the Duffing configs use) destroys a near-optimal start on the FIRST
  # step: Adam's step is ~lr per element regardless of scale, so with B entries
  # ~5e-3 and rho(A) = 0.95 it moves A a long way and the rollout explodes.
  # Pinned by TestKnownCouplings::test_a_large_lr_destroys_a_near_perfect_start.
  learning_rate: 0.00005
  use_scheduler: false      # a scheduler would confound the gate's fixed budget

training:
  max_epochs: 40
  gradient_clip_value: 1.0
  loss_type: "mse"
  use_custom_regularization: true
  # Near the optimum the barrier is O(100) while pred_loss is O(1e-4), so at 1e-3
  # it contributes ~660x the prediction loss and the optimizer minimizes the
  # barrier instead of the fit. At 0 the run ends INFEASIBLE, so the barrier is
  # needed — it just has to be scaled against the prediction loss.
  # Pinned by TestKnownCouplings::test_the_barrier_weight_dominates_near_the_optimum.
  regularization_weight: 1.0e-5
  decay_regularization_weight: false   # constant, so the gate measures one setting
  min_regularization_weight: 1.0e-7
  device: "cpu"
  log_gradients: false
  # Must outlast the washout transient: the trainer rolls out from x0 = 0 while the
  # data starts elsewhere (see the WASHOUT INITIALIZATION note in trainer.py). With
  # rho(A) = 0.95 here, 150 steps leaves ~5e-4 of it.
  warmup_steps: 150
  input_regularization_weight: 0.0
  activity_regularization_weight: 0.0
  h_regularization_weight: 0.0
  solve_max_s_on_violation: true

mlflow:
  tracking_uri: null
  experiment_name: "smoketest-crnn-sanity_gate"
