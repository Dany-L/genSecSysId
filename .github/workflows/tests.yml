name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # GitHub-hosted runners are CPU-only. To actually exercise the GPU device
    # paths, change this to a GPU runner, e.g. a self-hosted one:
    #   runs-on: [self-hosted, gpu]
    # The install step below adapts automatically to whichever runner is used.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "GPU detected -> installing CUDA torch (default wheels) to test device paths"
            pip install -e ".[dev]"
          else
            echo "No GPU -> installing CPU-only torch wheel (lighter, identical coverage)"
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -e ".[dev]"
          fi
          pip install cvxpy   # needed to import the solver-backed tests (MOSEK tests skip without a license)

      - name: Report torch device
        run: python -c "import torch; print('torch', torch.__version__, '| CUDA available:', torch.cuda.is_available())"

      - name: Run tests
        run: pytest tests/ -q
